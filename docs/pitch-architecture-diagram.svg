<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap');

      .font-heading { font-family: 'Space Grotesk', -apple-system, sans-serif; }
      .font-sans { font-family: 'Inter', -apple-system, sans-serif; }
      .font-mono { font-family: 'IBM Plex Mono', monospace; }

      .glow-ai { filter: drop-shadow(0 0 24px rgba(99, 102, 241, 0.25)); }
      .glow-policy { filter: drop-shadow(0 0 28px rgba(232, 163, 61, 0.28)); }
      .glow-action { filter: drop-shadow(0 0 20px rgba(45, 190, 143, 0.22)); }
      .glow-escalate { filter: drop-shadow(0 0 20px rgba(194, 76, 76, 0.22)); }
    </style>

    <!-- Gradients & Filters -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="50%" stop-color="#0E1116"/>
      <stop offset="100%" stop-color="#080A0D"/>
    </linearGradient>

    <radialGradient id="ai-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="policy-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Markers for Connector Arrows -->
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-ai" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818CF8"/>
    </marker>
    <marker id="arrow-policy-left" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C24C4C"/>
    </marker>
    <marker id="arrow-policy-right" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2DBE8F"/>
    </marker>
    <marker id="arrow-jade" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2DBE8F"/>
    </marker>
    <marker id="arrow-audit" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#262B33" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Ambient Glow Spots -->
  <circle cx="960" cy="300" r="400" fill="url(#ai-glow)"/>
  <circle cx="960" cy="480" r="450" fill="url(#policy-glow)"/>

  <!-- HEADER BAR -->
  <g transform="translate(120, 48)">
    <text x="0" y="32" fill="#ECEFF3" font-size="28" font-weight="700" class="font-heading" letter-spacing="-0.5">AI REVENUE RECOVERY ORCHESTRATOR</text>
    <text x="0" y="58" fill="#8B93A1" font-size="14" class="font-sans">Production Architecture Pipeline • LangGraph Stateful Decision Engine</text>

    <!-- Top Callout Badge: AI Proposes, Policy Decides -->
    <g transform="translate(1200, 8)">
      <rect x="0" y="0" width="480" height="44" rx="22" fill="#14171C" stroke="#E8A33D" stroke-width="1.5" stroke-opacity="0.6"/>
      <circle cx="24" cy="22" r="6" fill="#E8A33D"/>
      <text x="40" y="27" fill="#ECEFF3" font-size="13" font-weight="600" class="font-sans">CORE PRINCIPLE:</text>
      <text x="160" y="27" fill="#E8A33D" font-size="13" font-weight="700" class="font-sans">AI Proposes, Policy Decides</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- STEP 1: PAYMENT FAILURE DETECTED (Neutral Top Box) -->
  <!-- ========================================================================= -->
  <g transform="translate(630, 130)" filter="url(#shadow-card)">
    <rect x="0" y="0" width="660" height="88" rx="12" fill="#14171C" stroke="#262B33" stroke-width="1.5"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#262B33" fill-opacity="0.5"/>
    <text x="34" y="40" fill="#8B93A1" font-size="18" font-weight="700" text-anchor="middle" class="font-heading">1</text>
    
    <text x="68" y="38" fill="#ECEFF3" font-size="18" font-weight="700" class="font-heading">1. Payment Failure Ingestion &amp; Sanitization</text>
    <text x="68" y="60" fill="#8B93A1" font-size="13" class="font-sans">Nodes 1 &amp; 2 (detect_and_load, extract_evidence) • Masks PII • Zero secrets exposed</text>
    
    <rect x="520" y="18" width="124" height="24" rx="6" fill="#262B33" fill-opacity="0.6"/>
    <text x="582" y="34" fill="#8B93A1" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">INITIAL EVENT</text>
  </g>

  <!-- Connector: Step 1 -> Step 2 -->
  <path d="M 960 218 L 960 256" stroke="#4B5563" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-neutral)"/>

  <!-- ========================================================================= -->
  <!-- STEP 2: AI DIAGNOSIS (Google Gemini - Distinct Vibrant Violet Box) -->
  <!-- ========================================================================= -->
  <g transform="translate(560, 260)" class="glow-ai" filter="url(#shadow-card)">
    <rect x="0" y="0" width="800" height="110" rx="14" fill="#14171C" stroke="#6366F1" stroke-width="2"/>
    <rect x="0" y="0" width="800" height="110" rx="14" fill="#6366F1" fill-opacity="0.04"/>
    
    <!-- Left Accent Strip -->
    <path d="M 0 14 Q 0 0 14 0 L 18 0 L 18 110 L 14 110 Q 0 110 0 96 Z" fill="#6366F1"/>

    <rect x="32" y="20" width="40" height="40" rx="10" fill="#6366F1" fill-opacity="0.2"/>
    <text x="52" y="46" fill="#818CF8" font-size="20" font-weight="700" text-anchor="middle" class="font-heading">2</text>

    <text x="88" y="44" fill="#ECEFF3" font-size="20" font-weight="700" class="font-heading">2. Bounded AI Diagnosis &amp; Strategy Scoring</text>
    <text x="88" y="70" fill="#C7D2FE" font-size="13.5" font-weight="500" class="font-sans">Nodes 3 &amp; 4 (diagnose, score_strategy) • Powered by Google Gemini 2.5 Flash</text>
    <text x="88" y="92" fill="#818CF8" font-size="12.5" font-weight="600" class="font-sans">⚠ ADVISORY ROLE ONLY: Classifies root cause &amp; suggests action • Has ZERO financial authority</text>

    <!-- AI Badge -->
    <g transform="translate(630, 18)">
      <rect x="0" y="0" width="150" height="28" rx="8" fill="#6366F1" fill-opacity="0.25" stroke="#6366F1" stroke-width="1"/>
      <text x="75" y="18" fill="#C7D2FE" font-size="11.5" font-weight="700" text-anchor="middle" class="font-mono">PROBABILISTIC AI</text>
    </g>
  </g>

  <!-- Connector: Step 2 -> Step 3 -->
  <path d="M 960 370 L 960 412" stroke="#818CF8" stroke-width="2.5" fill="none" marker-end="url(#arrow-ai)"/>
  <rect x="870" y="380" width="180" height="20" rx="4" fill="#0B0D10" stroke="#6366F1" stroke-width="1"/>
  <text x="960" y="394" fill="#818CF8" font-size="10.5" font-weight="600" text-anchor="middle" class="font-mono">PROPOSES CANDIDATE</text>

  <!-- ========================================================================= -->
  <!-- STEP 3: DETERMINISTIC POLICY ENGINE (Authoritative Amber Box) -->
  <!-- ========================================================================= -->
  <g transform="translate(520, 416)" class="glow-policy" filter="url(#shadow-card)">
    <rect x="0" y="0" width="880" height="124" rx="14" fill="#14171C" stroke="#E8A33D" stroke-width="2.5"/>
    <rect x="0" y="0" width="880" height="124" rx="14" fill="#E8A33D" fill-opacity="0.05"/>
    
    <!-- Left Accent Strip -->
    <path d="M 0 14 Q 0 0 14 0 L 20 0 L 20 124 L 14 124 Q 0 124 0 110 Z" fill="#E8A33D"/>

    <rect x="34" y="24" width="44" height="44" rx="10" fill="#E8A33D" fill-opacity="0.2"/>
    <text x="56" y="53" fill="#E8A33D" font-size="22" font-weight="700" text-anchor="middle" class="font-heading">3</text>

    <text x="94" y="44" fill="#ECEFF3" font-size="21" font-weight="700" class="font-heading">3. Deterministic Policy Engine (The Gatekeeper)</text>
    <text x="94" y="72" fill="#FDE68A" font-size="14" font-weight="500" class="font-sans">Node 5 (evaluate_policy) • 100% Python Rule Engine • Zero LLM • Zero Network Calls</text>
    <text x="94" y="96" fill="#E8A33D" font-size="13" font-weight="600" class="font-sans">AUTHORITATIVE DECISION: Enforces ₹15k amount caps, 3-retry limit, cooldown &amp; mandate rules</text>

    <!-- Policy Badge -->
    <g transform="translate(680, 18)">
      <rect x="0" y="0" width="180" height="30" rx="8" fill="#E8A33D" fill-opacity="0.25" stroke="#E8A33D" stroke-width="1.5"/>
      <text x="90" y="19" fill="#FDE68A" font-size="11.5" font-weight="700" text-anchor="middle" class="font-mono">DETERMINISTIC GATE</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BRANCHING PATHS BELOW POLICY ENGINE -->
  <!-- ========================================================================= -->

  <!-- Left Branch Path: BLOCK / ESCALATE / STOP -->
  <path d="M 720 540 L 720 590 L 440 590 L 440 630" stroke="#C24C4C" stroke-width="2.5" fill="none" marker-end="url(#arrow-policy-left)"/>
  <rect x="330" y="578" width="220" height="24" rx="6" fill="#0B0D10" stroke="#C24C4C" stroke-width="1"/>
  <text x="440" y="594" fill="#D4605F" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">BLOCK / ESCALATE / STOP</text>

  <!-- Right Branch Path: ALLOW / DOWNGRADE -->
  <path d="M 1200 540 L 1200 590 L 1480 590 L 1480 630" stroke="#2DBE8F" stroke-width="2.5" fill="none" marker-end="url(#arrow-policy-right)"/>
  <rect x="1370" y="578" width="220" height="24" rx="6" fill="#0B0D10" stroke="#2DBE8F" stroke-width="1"/>
  <text x="1480" y="594" fill="#2DBE8F" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">ALLOW / DOWNGRADE</text>

  <!-- ========================================================================= -->
  <!-- LEFT BOX: ESCALATE OR STOP (No Financial Action) -->
  <!-- ========================================================================= -->
  <g transform="translate(180, 634)" class="glow-escalate" filter="url(#shadow-card)">
    <rect x="0" y="0" width="520" height="150" rx="12" fill="#14171C" stroke="#C24C4C" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="150" rx="12" fill="#C24C4C" fill-opacity="0.04"/>

    <circle cx="36" cy="36" r="14" fill="#C24C4C" fill-opacity="0.2"/>
    <text x="36" y="42" fill="#D4605F" font-size="16" font-weight="700" text-anchor="middle" class="font-heading">4A</text>

    <text x="64" y="40" fill="#ECEFF3" font-size="17" font-weight="700" class="font-heading">Human Escalation or Safe Stop</text>
    <text x="24" y="72" fill="#D4605F" font-size="13" font-weight="600" class="font-sans">🚫 ZERO FINANCIAL ACTION DISPATCHED</text>
    
    <text x="24" y="98" fill="#8B93A1" font-size="12.5" class="font-sans">• High-value cases (&gt;₹15,000) routed to operations team</text>
    <text x="24" y="118" fill="#8B93A1" font-size="12.5" class="font-sans">• Risk / security blocks halted to protect merchant score</text>
    <text x="24" y="138" fill="#8B93A1" font-size="12.5" class="font-sans">• Exhausted retries frozen (prevents penalty fees)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT BOXES: EXECUTE ACTION -> VERIFY OUTCOME -->
  <!-- ========================================================================= -->
  <g transform="translate(1220, 634)" class="glow-action" filter="url(#shadow-card)">
    <rect x="0" y="0" width="520" height="150" rx="12" fill="#14171C" stroke="#2DBE8F" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="150" rx="12" fill="#2DBE8F" fill-opacity="0.04"/>

    <!-- Step 4B: Execute Action -->
    <g transform="translate(20, 16)">
      <circle cx="16" cy="16" r="14" fill="#38BDF8" fill-opacity="0.2"/>
      <text x="16" y="22" fill="#38BDF8" font-size="14" font-weight="700" text-anchor="middle" class="font-heading">4B</text>
      <text x="40" y="22" fill="#ECEFF3" font-size="15.5" font-weight="700" class="font-heading">Execute Action (Node 6: execute_action)</text>
      <text x="40" y="42" fill="#8B93A1" font-size="12" class="font-sans">Dispatches via Razorpay API (Payment Link / Smart Retry)</text>
    </g>

    <!-- Dividing Line -->
    <line x1="20" y1="74" x2="500" y2="74" stroke="#262B33" stroke-width="1"/>

    <!-- Step 4C: Verify Outcome -->
    <g transform="translate(20, 86)">
      <circle cx="16" cy="18" r="14" fill="#2DBE8F" fill-opacity="0.2"/>
      <text x="16" y="24" fill="#2DBE8F" font-size="14" font-weight="700" text-anchor="middle" class="font-heading">4C</text>
      <text x="40" y="22" fill="#ECEFF3" font-size="15.5" font-weight="700" class="font-heading">Verify Outcome (Node 7: verify_outcome)</text>
      <text x="40" y="42" fill="#2DBE8F" font-size="12" font-weight="600" class="font-sans">✓ Independent gateway verification: ONLY paid/captured counts as revenue</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CONVERGENCE CONNECTORS TO AUDIT TRAIL -->
  <!-- ========================================================================= -->
  <!-- From Left Path (Escalation) -->
  <path d="M 440 784 L 440 850 L 800 850 L 800 890" stroke="#8B93A1" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-neutral)"/>
  
  <!-- From Right Path (Verified Recovery) -->
  <path d="M 1480 784 L 1480 850 L 1120 850 L 1120 890" stroke="#2DBE8F" stroke-width="2" fill="none" marker-end="url(#arrow-jade)"/>

  <!-- ========================================================================= -->
  <!-- STEP 5: IMMUTABLE AUDIT TRAIL (Bottom Converged Box) -->
  <!-- ========================================================================= -->
  <g transform="translate(460, 894)" filter="url(#shadow-card)">
    <rect x="0" y="0" width="1000" height="100" rx="14" fill="#14171C" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="0" y="0" width="1000" height="100" rx="14" fill="#38BDF8" fill-opacity="0.04"/>

    <rect x="28" y="20" width="40" height="40" rx="10" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="48" y="46" fill="#38BDF8" font-size="20" font-weight="700" text-anchor="middle" class="font-heading">5</text>

    <text x="84" y="42" fill="#ECEFF3" font-size="19" font-weight="700" class="font-heading">5. State Resolution &amp; Immutable Audit Trail</text>
    <text x="84" y="66" fill="#8B93A1" font-size="13.5" class="font-sans">Nodes 8 &amp; 9 (resolve_state, log_audit) • Writes to append-only SQL ledger (`audit_events` table)</text>
    <text x="84" y="86" fill="#38BDF8" font-size="12.5" font-weight="600" class="font-mono">Every action, decision rationale, policy check, and gateway settlement is cryptographically trackable</text>

    <g transform="translate(820, 20)">
      <rect x="0" y="0" width="150" height="28" rx="8" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
      <text x="75" y="18" fill="#BAE6FD" font-size="11.5" font-weight="700" text-anchor="middle" class="font-mono">APPEND-ONLY</text>
    </g>
  </g>

  <!-- Footer Stats / Summary Strip -->
  <g transform="translate(120, 1024)">
    <text x="0" y="16" fill="#4B5563" font-size="12" class="font-mono">TOTAL 9 LANGGRAPH NODES: detect_and_load → extract_evidence → diagnose → score_strategy → evaluate_policy → execute_action → verify_outcome → resolve_state → log_audit</text>
    <text x="1680" y="16" fill="#4B5563" font-size="12" text-anchor="end" class="font-mono">ONLY 1 AI NODE (DIAGNOSE)</text>
  </g>

</svg>
